name: PowerShell checks

on:
  push:
  pull_request:

jobs:
  test:
    name: Pester and ScriptAnalyzer
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run Pester
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests/SdKit.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed test(s)."
          }

      - name: Run ScriptAnalyzer error checks
        shell: pwsh
        run: |
          $errors = @(Invoke-ScriptAnalyzer -Path ./SdKit -Recurse -Severity Error)
          if ($errors.Count -gt 0) {
            $errors | Format-Table -AutoSize | Out-String | Write-Output
            throw "PSScriptAnalyzer reported $($errors.Count) error(s)."
          }
